# Render Blueprint — PolicyNext API (free tier).
#
# The SPA is NOT deployed here; it goes to Cloudflare Pages as a static site.
# Only the NestJS API needs a long-lived container, because /api/v1/events/stream
# holds an open Server-Sent Events connection per signed-in user.
#
# Postgres comes from Neon (Render's own free Postgres expires), so DATABASE_URL
# is entered manually rather than wired from a `databases:` block here.
#
# See docs/DEPLOYMENT.md for the full walkthrough.

services:
  - type: web
    name: policynext-api
    runtime: docker
    plan: free
    region: singapore # closest free region to India; also: oregon, frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Apply pending migrations before booting. Render's free plan has no
    # pre-deploy hook, so this runs as part of the start command.
    dockerCommand: npm run start:migrate
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # ── Set in the Render dashboard (marked sync:false = never in git) ──────
      # Neon pooled connection string. Must include ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Origin(s) of the deployed SPA, comma-separated, no trailing slash.
      # e.g. https://policynext.pages.dev
      - key: CORS_ORIGIN
        sync: false

      # The SPA and API are on different sites here, so Lax cookies would be
      # dropped by the browser and nothing would authenticate. See
      # backend/src/auth/auth.controller.ts for the full explanation.
      - key: COOKIE_SAMESITE
        value: none

      # ── Object storage (Cloudflare R2) ─────────────────────────────────────
      # Render's free tier has an ephemeral filesystem: without these, every
      # uploaded document and avatar is lost on restart and redeploy.
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto

      # ── Secrets ────────────────────────────────────────────────────────────
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      # Must be exactly 32 bytes of hex — generateValue does not guarantee the
      # length, so set this by hand: openssl rand -hex 32
      - key: ENCRYPTION_KEY
        sync: false

      # ── Email / SMS (optional) ─────────────────────────────────────────────
      # Leave unset to fall back to an Ethereal test inbox and console-logged
      # OTPs. Real OTP delivery needs these.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
