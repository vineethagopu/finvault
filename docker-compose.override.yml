version: '3.9'

# Local dev override — no SSL, hot reload mounts, exposed ports
services:
  postgres:
    ports:
      - "5432:5432"
    networks:
      - internal

  backend:
    build:
      context: ./backend
      target: builder
    command: npm run start:dev
    tty: true
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-policynext}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-policynext}?schema=public
      # Secrets/config resolve from the root .env (single source of truth);
      # the :- fallbacks keep today's dev defaults so nothing breaks if unset.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-prod}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-chars-here}
      UPLOAD_DIR: /app/uploads
      PORT: 3000
      # Poll the bind mount so Nest's watch picks up src/ edits in Docker.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Email/SMS — empty = dev fallbacks (Ethereal test inbox / console OTP echo).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_SID: ${TWILIO_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    volumes:
      - ./backend/src:/app/src:delegated
      - ./backend/prisma:/app/prisma:delegated
      - uploads_dev:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      target: builder
    command: sh -c "npm run dev -- --host 0.0.0.0"
    tty: true
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
      # Poll the bind mount so edits under src/ hot-reload (no rebuild needed).
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src:delegated
      - ./frontend/index.html:/app/index.html:delegated
      - ./frontend/vite.config.ts:/app/vite.config.ts:delegated
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  uploads_dev:

networks:
  internal:
    driver: bridge
    internal: false
